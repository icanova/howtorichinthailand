<!DOCTYPE html>
<!-- ============================================================
  HOW TO RICH — Card Battler · patch 2.0
  เทิร์นเบส · คอมแบตโต้ตอบข้ามเครื่อง · เศรษฐกิจ/ส่วย/คุก · มือปืน+ชุบชีวิต
  State กลางอยู่ใน rooms (turn_seat/round/board/active_battle) + players (cash/stars/status/hand)
  Dual backend: DEMO=localStorage(poll) / จริง=Supabase realtime
  ---- CHANGELOG v1.0 ----
  * เริ่มเกมใหม่ card-battler (รื้อ core loop จาก board-game patch 11)
  * ลำดับเทิร์นข้ามเครื่อง (turn_seat หมุนรอบ ข้าม jailed/ordained)
  * กิจกรรมหาเงิน 3 ที่: บ้าน(OnlyFans/สแกม) ตลาด(รีดไถ/ไฮโล) วัด(ปล้นวัด/บวช)
  * สแกม 50/50 +40k/-5k + แชทเหยื่อ 6 แบบสุ่ม
  * เศรษฐกิจ เริ่ม 0฿ · ซื้อตึก 5 ใบ · ส่วยต่อตึกตามดาว · จ่ายไม่ไหว=ติดคุก+ยึดตึก
  * คอมแบต attrition: ผู้ชนะเก็บลูกน้อง ≤ margin · ผู้แพ้เสียหมด
  * บุก/ยึดตึกแบบ B (ทุบคงทนสะสม · คงทน 0 = เปลี่ยนเจ้าของ)
  * บวช: 50k หยุด 3 ตา ลด 3★ ฟรีซ ป้องกันตึกไม่ได้
  * มือปืน 100k ATK6 → ประกันตัว 50k (20วิ) → ชุบชีวิต d6 4+รอด/1-3 เป็นลูกน้องคนจ้าง
  * การ์ด/บอร์ดเรนเดอร์เป็นกล่อง+TEXT (placeholder) ใส่รูปทีหลังได้
============================================================ -->
<html lang="th"><head>

<style>

    color:var(--ink);min-height:100vh;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
  .wrap{max-width:600px;margin:0 auto;padding:14px}
  h1{font-size:20px;color:var(--gold);text-align:center;margin-bottom:2px}
  .sub{text-align:center;color:var(--muted);font-size:12px;margin-bottom:14px}
  .screen{display:none} .screen.on{display:block}
  input{width:100%;padding:12px;border-radius:9px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);font:inherit;font-size:15px;margin:6px 0}

  .row{display:flex;gap:8px}.row>*{flex:1}
  .card-code{font-size:28px;font-weight:700;letter-spacing:6px;color:var(--gold);text-align:center;background:var(--bg2);border-radius:10px;padding:9px;margin:8px 0}

  .opps{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}

  .hc .atkv{color:var(--atkc)}.hc .defv{color:var(--defc)}
  .log{font-size:12px;color:var(--muted);background:var(--bg2);border-radius:8px;padding:8px 10px;margin-top:9px;max-height:120px;overflow:auto;line-height:1.7}

  .big{text-align:center;font-size:38px;font-weight:700;color:var(--gold);font-family:'Bai Jamjuree','Loma';margin:6px 0}
  .vs{display:flex;align-items:center;justify-content:center;gap:16px;margin:10px 0}
  .vs .side{text-align:center;flex:1}.vs .side .n{font-size:32px;font-weight:700;font-family:'Bai Jamjuree'}
  .vs .side.a .n{color:var(--atkc)}.vs .side.d .n{color:var(--defc)}.vs .x{font-size:20px}
  .tot{text-align:center;font-size:13px;margin:6px 0}.tot b{font-size:22px;color:var(--gold);font-family:'Bai Jamjuree'}
  .win{color:var(--ok)}.lose{color:var(--blood)}
  .waitbox{text-align:center;color:var(--muted);padding:26px}
  .hint{font-size:11px;color:var(--muted);text-align:center;margin-top:8px;line-height:1.5}
  .chat{background:var(--bg2);border-radius:10px;padding:10px;margin:8px 0;min-height:60px}
  .bub{max-width:80%;padding:8px 11px;border-radius:12px;margin:5px 0;font-size:13px;line-height:1.4}
  .bub.me{background:#2a6a4a;color:#eafff2;margin-left:auto;border-bottom-right-radius:3px}
  .bub.them{background:#33283f;border-bottom-left-radius:3px}
  .count{font-size:30px;font-weight:700;color:var(--blood);font-family:'Bai Jamjuree';text-align:center}
  .demo{position:fixed;top:0;left:0;right:0;text-align:center;font-size:10px;background:var(--blood);color:#fff;padding:2px;z-index:99;display:none}
  .pill{display:inline-block;font-size:11px;padding:2px 7px;border-radius:7px;background:var(--bg2);margin:2px}
</style></head>

<script>
const $=id=>document.getElementById(id);
const VERSION='patch 2.1';
/* ===================== CONFIG ===================== */
const CARDS={
  h1:{t:'hench',name:'ลูกน้อง',   atk:2,def:2,ic:'👤'},
  h2:{t:'hench',name:'เด็กเฝ้าร้าน',atk:1,def:3,ic:'🛡️'},
  h3:{t:'hench',name:'มือปืน',    atk:5,def:0,ic:'🔫'},
  h4:{t:'hench',name:'เด็กแว๊น',  atk:3,def:0,ic:'🏍️'},
  b1:{t:'buff',name:'เสื้อเกราะ', def:2,ic:'🦺'},
  b2:{t:'buff',name:'ปืนจีนแดง',  atk:2,ic:'🔫'},
  b3:{t:'buff',name:'ผู้รับเหมา', def:3,ic:'🧱'},
  b4:{t:'buff',name:'สตง.',       enemy:2,ic:'📉'},
};
const POOL=['h1','h1','h1','h2','h2','h3','h4','b1','b2','b3','b4'];
const BUILD={
  1:{name:'ร้านไก่ทอด', sub:'ค้ายา',    income:40000,heat:3,cost:180000},
  2:{name:'มูลนิธิกุศล',sub:'ค้ามนุษย์',income:35000,heat:2,cost:160000},
  3:{name:'ร้านแต่งรถ', sub:'เว็บพนัน',  income:25000,heat:1,cost:110000},
  4:{name:'ร้านนวด',    sub:'ขายบริการ',income:30000,heat:1,cost:140000},
  5:{name:'พรรคการเมือง',sub:'กันคุก',  income:25000,heat:0,cost:130000,party:true},
};
const CFG={
  start_cash:0, hand_max:7, hand_start:6, draw_per_turn:2,
  max_commit:3, dur_start:3,
  scam_cost:5000, scam_win:40000, scam_need:3,
  onlyfans:15000, market_win:25000, market_rpb:3, wat_win:120000, wat_rpb:7, wat_heat:3,
  monk_cost:50000, monk_turns:3,
  hitman_cost:100000, hitman_atk:6, bail_cost:50000, bail_secs:20,
};
const TITHE=[ {min:10,per:30000},{min:8,per:20000},{min:5,per:10000},{min:0,per:0} ];
const tithePer=stars=>{ for(const t of TITHE){ if(stars>=t.min) return t.per; } return 0; };
const SCAM_OK=[
 'พัสดุตกค้างศุลกากร → "อ้าว จริงเหรอคะ 😱 เดี๋ยวโอนให้เลยนะคะ 🙏"',
 'แฟนออนไลน์ส่งทอง → "โอ๊ยย รักพี่จัง 🥰 เดี๋ยวหนูโอนค่าส่งให้ 💸"',
 'บัญชีพัวพันคดี(ตร.ปลอม) → "หนูไม่ได้ทำนะคะ! 😭 เดี๋ยวโอนพิสูจน์เลยค่ะ"'];
const SCAM_NO=[
 '"อ๋อ แก๊งคอลเซ็นเตอร์สินะ 🙄 บล็อกเลยจ้า"',
 '"ลุงรู้ทันนะ ปปง.ไม่โทรแบบนี้ 😏 โทร 191 แล้ว"',
 '"เนียนแต่ไม่พอจ้ะ มิจๆ 👋 เดี๋ยวเอาไปลงเพจแฉ 📸"'];
const d6=()=>1+Math.floor(Math.random()*6);
const genId=()=>Math.random().toString(36).slice(2,10);
const genCode=()=>Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
const money=n=>'฿'+(n||0).toLocaleString('en-US');
const dealHand=n=>Array.from({length:n},()=>({uid:genId(),c:POOL[Math.floor(Math.random()*POOL.length)]}));
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ===================== BACKEND ===================== */
const SUPABASE_URL='https://bolwnthrbjtlxblbwwkj.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJvbHdudGhyYmp0bHhibGJ3d2tqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5NDE2MDEsImV4cCI6MjEwNjUxNzYwMX0.prlNtDXal_1hD0C4TY9oOPvQMOAs4UzNHZb3vNDd2GU';
const DEMO=!SUPABASE_URL||!SUPABASE_ANON;
let IDENTITY=sessionStorage.getItem('htr_id'); if(!IDENTITY){IDENTITY=genId();sessionStorage.setItem('htr_id',IDENTITY);}
const freshPlayer=(rid,name,seat)=>({room_id:rid,identity:IDENTITY,name,seat,
  cash:CFG.start_cash,stars:0,status:'active',ordain_left:0,hand:dealHand(CFG.hand_start)});
const freshBoard=()=>{const b={};for(let s=1;s<=5;s++)b[s]={owner:null,dur:0};return b;};

function LocalBackend(){
  const KEY='htr_db';
  const read=()=>JSON.parse(localStorage.getItem(KEY)||'{"rooms":{},"players":{}}');
  const write=db=>localStorage.setItem(KEY,JSON.stringify(db));
  const subs=[]; setInterval(()=>subs.forEach(s=>{try{s()}catch(e){}}),600);
  const plIn=(db,rid)=>Object.values(db.players).filter(p=>p.room_id===rid).sort((a,b)=>a.seat-b.seat);
  return {
    async createRoom(code,name){ const db=read(); const rid=genId();
      db.rooms[rid]={id:rid,code,host:IDENTITY,state:'lobby',turn_seat:1,round:1,
        board:freshBoard(),active_battle:null,turn_init:'',event:null,winner:null};
      const pid=genId(); db.players[pid]={id:pid,...freshPlayer(rid,name,1)};
      write(db); return db.rooms[rid]; },
    async roomByCode(code){ return Object.values(read().rooms).find(r=>r.code===code)||null; },
    async getRoom(rid){ return read().rooms[rid]||null; },
    async players(rid){ return plIn(read(),rid); },
    async join(rid,name){ const db=read(); const ex=plIn(db,rid).find(p=>p.identity===IDENTITY);
      if(ex) return ex; const pid=genId();
      db.players[pid]={id:pid,...freshPlayer(rid,name,plIn(db,rid).length+1)};
      write(db); return db.players[pid]; },
    async setPlayer(pid,patch){ const db=read(); if(db.players[pid]){Object.assign(db.players[pid],patch);write(db);} },
    async setRoom(rid,patch){ const db=read(); if(db.rooms[rid]){Object.assign(db.rooms[rid],patch);write(db);} },
    sub(rid,cb){ subs.push(cb); return ()=>{const i=subs.indexOf(cb);if(i>=0)subs.splice(i,1);}; },
  };
}
function SbBackend(){
  const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON);
  const mapP=p=>({id:p.id,room_id:p.room_id,identity:p.identity,name:p.display_name,seat:p.seat_order,
    cash:p.cash||0,stars:p.stars||0,status:p.status||'active',ordain_left:p.ordain_left||0,hand:p.hand||[]});
  const mapR=r=>r?{id:r.id,code:r.code,host:r.host_identity,state:r.state,turn_seat:r.turn_seat,round:r.round,
    board:r.board,active_battle:r.active_battle,turn_init:r.turn_init,event:r.event,winner:r.winner}:null;
  const plIn=async rid=>{ const {data}=await sb.from('players').select('*').eq('room_id',rid).order('seat_order'); return (data||[]).map(mapP); };
  return {
    async createRoom(code,name){
      const {data:room,error}=await sb.from('rooms').insert({code,host_identity:IDENTITY,state:'lobby',
        turn_seat:1,round:1,board:freshBoard(),active_battle:null,turn_init:'',event:null,winner:null}).select().single(); if(error)throw error;
      const {error:pe}=await sb.from('players').insert({room_id:room.id,identity:IDENTITY,display_name:name,seat_order:1,
        cash:CFG.start_cash,stars:0,status:'active',ordain_left:0,hand:dealHand(CFG.hand_start)}); if(pe)throw pe;
      return mapR(room); },
    async roomByCode(code){ const {data}=await sb.from('rooms').select('*').eq('code',code).maybeSingle(); return mapR(data); },
    async getRoom(rid){ const {data}=await sb.from('rooms').select('*').eq('id',rid).maybeSingle(); return mapR(data); },
    async players(rid){ return plIn(rid); },
    async join(rid,name){ const {data:ex}=await sb.from('players').select('*').eq('room_id',rid).eq('identity',IDENTITY).maybeSingle();
      if(ex) return mapP(ex); const cur=await plIn(rid);
      const {data,error}=await sb.from('players').insert({room_id:rid,identity:IDENTITY,display_name:name,seat_order:cur.length+1,
        cash:CFG.start_cash,stars:0,status:'active',ordain_left:0,hand:dealHand(CFG.hand_start)}).select().single();
      if(error)throw error; if(!data)throw new Error('เพิ่มผู้เล่นไม่ได้ — เช็ค RLS/คอลัมน์ใน Supabase');
      return mapP(data); },
    async setPlayer(pid,patch){ const q={}; for(const k in patch){ q[k==='name'?'display_name':k==='seat'?'seat_order':k]=patch[k]; } await sb.from('players').update(q).eq('id',pid); },
    async setRoom(rid,patch){ await sb.from('rooms').update(patch).eq('id',rid); },
    sub(rid,cb){ const ch=sb.channel('htr-'+rid)
        .on('postgres_changes',{event:'*',schema:'public',table:'players',filter:'room_id=eq.'+rid},cb)
        .on('postgres_changes',{event:'*',schema:'public',table:'rooms',filter:'id=eq.'+rid},cb).subscribe();
      return ()=>sb.removeChannel(ch); },
  };
}
const api=DEMO?LocalBackend():SbBackend();

/* ===================== STATE ===================== */
let room=null, me=null, PS=[], unsub=null;

const meP=()=>PS.find(p=>p.identity===IDENTITY);
const byId=id=>PS.find(p=>p.id===id);
const bySeat=s=>PS.find(p=>p.seat===s);
const isMyTurn=()=>room&&room.state==='playing'&&me&&bySeat(room.turn_seat)&&bySeat(room.turn_seat).identity===IDENTITY;
const battleActive=()=>room&&room.active_battle&&room.active_battle.phase&&room.active_battle.phase!=='done';

function enter(){ if(unsub)unsub(); unsub=api.sub(room.id,refresh); refresh(); }

/* ===================== REFRESH ===================== */
async function refresh(){ if(!room)return;
  const [r,ps]=await Promise.all([api.getRoom(room.id),api.players(room.id)]);
  if(!r)return; room=r; PS=ps; me=ps.find(p=>p.identity===IDENTITY)||me;
  if(room.state==='lobby'){ show('wait'); renderWait(); return; }
  if(room.state==='ended'){ show('table'); renderTable(); showWinner(); return; }
  // playing
  show('table');
  maybeStartTurn();
  const key=JSON.stringify({ r:room.round,ts:room.turn_seat,ev:room.event,
    b:room.active_battle?(room.active_battle.seq+'/'+room.active_battle.phase):'0',
    p:ps.map(p=>[p.id,p.cash,p.stars,p.status,p.ordain_left,(p.hand||[]).length]),
    bd:room.board, m:mode&&(mode.type||mode) });
  if(key!==lastKey){ lastKey=key; renderTable(); }
  handleBattle(room.active_battle);
}
function renderWait(){ $('waitCode').textContent=room.code;
  $('waitList').innerHTML=PS.map(p=>`<div class="pill">${esc(p.name)}${p.identity===room.host?' 👑':''}${p.identity===IDENTITY?' (คุณ)':''}</div>`).join('');
  $('btnStart').style.display=room.host===IDENTITY?'block':'none';
  $('btnStart').disabled=PS.length<2; }

/* ===================== TURN LIFECYCLE ===================== */
async function maybeStartTurn(){
  if(!isMyTurn()||battleActive())return;
  const token=room.round+'-'+room.turn_seat;
  if(room.turn_init===token)return;           // already initialised this turn
  const p=meP(); if(!p)return;
  // --- ordained: frozen, auto-advance ---
  if(p.status==='ordained'){
    await api.setRoom(room.id,{turn_init:token});
    const left=p.ordain_left-1, ns=Math.max(0,p.stars-1);
    const patch={ordain_left:left,stars:ns};
    if(left<=0) patch.status='active';
    await api.setPlayer(p.id,patch);
    logLine(`🧘 คุณบวชอยู่ (−1★ · เหลือ ${Math.max(0,left)} ตา)`);
    setTimeout(endTurn,1400); return;
  }
  // --- active: income + heat + tithe + draw + event ---
  await api.setRoom(room.id,{turn_init:token});
  let cash=p.cash, stars=p.stars, inc=0, heat=0;
  for(let s=1;s<=5;s++){ if(room.board[s]&&room.board[s].owner===p.id){ inc+=BUILD[s].income; heat+=BUILD[s].heat; } }
  cash+=inc; stars+=heat;
  // tithe
  const per=tithePer(stars); let owned=0; for(let s=1;s<=5;s++) if(room.board[s]&&room.board[s].owner===p.id) owned++;
  const tithe=per*owned;
  let jailed=false;
  if(tithe>0){ if(cash>=tithe){ cash-=tithe; } else { jailed=true; } }
  // draw up to hand_max
  let hand=[...(p.hand||[])];
  const room2={board:{...room.board}};
  if(jailed){
    // seize buildings to neutral
    for(let s=1;s<=5;s++) if(room.board[s]&&room.board[s].owner===p.id){ room2.board[s]={owner:null,dur:0}; }
    await api.setRoom(room.id,{board:room2.board});
    await api.setPlayer(p.id,{cash,stars,status:'jailed'});
    logLine(`🚔 ${esc(p.name)} จ่ายส่วย ${money(tithe)} ไม่ไหว → ติดคุก! ตึกถูกยึดคืน`);
    setTimeout(()=>{ checkWin(); endTurn(); },1600); return;
  }
  const canDraw=Math.max(0,CFG.hand_max-hand.length);
  if(canDraw>0) hand=[...hand,...dealHand(Math.min(CFG.draw_per_turn,canDraw))];
  await api.setPlayer(p.id,{cash,stars,hand});
  // simple random event (star reduction offers)
  let ev=null;
  if(stars>=3 && Math.random()<0.35){ ev=Math.random()<0.5?'paid':'free'; }
  await api.setRoom(room.id,{event:ev});
  let msg=`📅 ตาคุณ (เดือน ${room.round}) · รายได้ ${money(inc)}`;
  if(heat>0)msg+=` · ★+${heat}`; if(tithe>0)msg+=` · ส่วย ${money(tithe)}`;
  logLine(msg);
}
async function endTurn(){
  if(!room||room.state!=='playing')return;
  const n=PS.length; let seat=room.turn_seat, round=room.round, guard=0;
  do{ seat++; if(seat>n){ seat=1; round++; } guard++;
      const pp=bySeat(seat);
      if(pp && pp.status!=='jailed') break;         // skip jailed (ordained still take frozen turn)
  }while(guard<=n+1);
  await api.setRoom(room.id,{turn_seat:seat,round,turn_init:'',event:null});
  await refresh();
}

/* ===================== RENDER TABLE ===================== */
function statusTag(p){
  if(p.status==='jailed')return '<span class="tag jail">คุก</span>';
  if(p.status==='ordained')return `<span class="tag monk">บวช ${p.ordain_left}</span>`;
  if(room.turn_seat===p.seat)return '<span class="tag turn">ตานี้</span>';
  return '';
}
function renderTable(){
  $('tCode').textContent=room.code; $('tRound').textContent=room.round;
  // opponents bar (everyone incl me small)
  $('opps').innerHTML=PS.map(p=>{
    const mine=p.identity===IDENTITY, turn=room.turn_seat===p.seat;
    let owned=0; for(let s=1;s<=5;s++) if(room.board[s]&&room.board[s].owner===p.id)owned++;
    return `<div class="opp ${turn?'turn':''} ${p.status==='jailed'?'dead':''}">
      <div class="nm"><span>${esc(p.name)}${mine?' ⭐':''}</span>${statusTag(p)}</div>
      <div class="st">💰${money(p.cash)}<br>⭐${p.stars} · 🏢${owned} · 🃏${(p.hand||[]).length}</div></div>`;
  }).join('');
  // board
  $('board').innerHTML=[1,2,3,4,5].map(s=>{
    const b=room.board[s],cfg=BUILD[s]; const o=b.owner?byId(b.owner):null;
    const mine=o&&o.identity===IDENTITY;
    const cls=o?(mine?'mine':'enemy'):'free';
    const ownTxt=o?`เจ้าของ: <b>${mine?'คุณ':esc(o.name)}</b> <span class="dur">🧱${b.dur}/${CFG.dur_start}</span>`:'<span style="color:var(--muted)">ว่าง — ซื้อได้</span>';
    return `<div class="bz ${cls}"><div class="bn">${cfg.party?'🏳️':'🏢'} ${cfg.name}</div>
      <div class="bi">${cfg.sub} · +${money(cfg.income)}/ตา · ★+${cfg.heat}</div>
      <div class="own">${ownTxt}</div></div>`;
  }).join('');
  // my stats
  const p=meP();
  if(p){ $('mystat').innerHTML=`💰 <b>${money(p.cash)}</b> &nbsp; ⭐ <b>${p.stars}</b> &nbsp; 🃏 <b>${(p.hand||[]).length}</b>`
    +(p.status==='ordained'?` &nbsp; 🧘 บวช(${p.ordain_left})`:'')+(p.status==='jailed'?' &nbsp; 🚔 ติดคุก':''); }
  renderActs(); renderHand();
}
function renderActs(){
  const p=meP(); const my=isMyTurn()&&p&&p.status==='active'&&!battleActive();
  const owned=[1,2,3,4,5].filter(s=>room.board[s]&&room.board[s].owner===p?.id).length;
  $('acts').innerHTML=`
    <button class="btn blue" data-a="home" ${my?'':'disabled'}>🏠 บ้าน</button>
    <button class="btn blue" data-a="market" ${my?'':'disabled'}>🏪 ตลาด</button>
    <button class="btn blue" data-a="wat" ${my?'':'disabled'}>🕉️ วัด</button>
    <button class="btn" data-a="buy" ${my?'':'disabled'}>🏢 ซื้อตึก</button>
    <button class="btn red" data-a="raid" ${my?'':'disabled'}>⚔️ บุก/มือปืน</button>
    <button class="btn ghost" data-a="end" ${my?'':'disabled'}>✔️ จบตา</button>`;
  $('acts').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>doAction(b.dataset.a));

}
let _evShown='';
function logLineOnce(id){ if(_evShown===id)return; _evShown=id; }
function handCardHtml(x,dim){ const c=CARDS[x.c]; if(!c)return'';
  const stat=c.t==='hench'?`<span class="atkv">⚔${c.atk}</span>/<span class="defv">🛡${c.def}</span>`
    :(c.atk?`<span class="atkv">⚔+${c.atk}</span>`:c.def?`<span class="defv">🛡+${c.def}</span>`:`<span style="color:#9ec3ff">ศัตรู-${c.enemy}</span>`);
  return `<div class="hc ${c.t} ${sel.has(x.uid)?'sel':''} ${dim?'dim':''}" data-uid="${x.uid}">
    <div class="ic">${c.ic}</div><div class="nm">${c.name}</div><div class="sx">${stat}</div></div>`;
}
function renderHand(){ const p=meP(); const h=p?p.hand||[]:[];
  $('handCount').textContent=`${h.length}/${CFG.hand_max}`;
  $('hand').innerHTML=h.map(x=>handCardHtml(x,false)).join('')||'<span style="color:var(--muted);font-size:12px;padding:12px">ไม่มีการ์ด</span>';
  $('hand').querySelectorAll('[data-uid]').forEach(el=>el.onclick=()=>logLine('💡 เลือกการ์ดตอนบุก/รับในหน้าต่างสู้'));
}

/* ===================== ACTIONS ===================== */
function doAction(a){
  if(!isMyTurn()||battleActive())return;
  if(a==='end') return endTurn();
  if(a==='home') return openHome();
  if(a==='market') return openMarket();
  if(a==='wat') return openWat();
  if(a==='buy') return openBuy();
  if(a==='raid') return openRaidMenu();
}

/* PvE fight (market/wat): pick henchmen, roll vs fixed NPC */
function pveFight(kind){
  sel.clear(); renderPve(kind);
}
function renderPve(kind){
  const p=meP(); const rpb=kind==='wat'?CFG.wat_rpb:CFG.market_rpb;
  const win=kind==='wat'?CFG.wat_win:CFG.market_win; const title=kind==='wat'?'🙏 ปล้นวัด':'💵 รีดไถตลาด';
  const cards=selList(); const {base}=sumSide(cards,'atk');
  ovShow(`<h2>${title}</h2>
    <div class="tot">พลังฝ่ายตรงข้าม(NPC): <b style="color:var(--defc)">${rpb}</b></div>
    <p class="hint">เลือกลูกน้อง (สูงสุด ${CFG.max_commit})</p>
    <div class="hand" id="mh">${handPickHtml('atk')}</div>
    <div class="tot">แต้มโจมตีจากการ์ด: <b>${base}</b> + เต๋า</div>
    <div class="row"><button class="btn red" id="go" ${cards.length?'':'disabled'}>🎲 ลุย!</button>
      <button class="btn ghost" id="cx" style="flex:0 0 80px">ยกเลิก</button></div>`);
  bindPick($('mh'),()=>renderPve(kind));
  $('cx').onclick=()=>{sel.clear();closeOv();};
  $('go').onclick=async()=>{
    const cards=selList(); if(!cards.length)return;
    const {base,enemy}=sumSide(cards,'atk'); const roll=d6(); const atk=base+roll;
    const defRoll=d6(); const def=rpb+defRoll;
    const atkWin=atk>=def;
    const p=meP(); let hand=[...p.hand]; let cash=p.cash, stars=p.stars;
    // loser loses committed henchmen; buffs always consumed
    const used=new Set();
    cards.forEach(({uid,c})=>{ const d=CARDS[c]; if(d.t==='buff')used.add(uid); else if(!atkWin)used.add(uid); });
    hand=hand.filter(x=>!used.has(x.uid));
    if(atkWin){ cash+=win; if(kind==='wat')stars+=CFG.wat_heat; }
    else { if(kind==='market')stars+=1; else if(kind==='wat')stars+=CFG.wat_heat; }
    await api.setPlayer(p.id,{hand,cash,stars});
    ovShow(`<h2>${title}</h2>
      <div class="vs"><div class="side a"><div class="n">${atk}</div><small>คุณ</small></div><div class="x">⚔️</div>
        <div class="side d"><div class="n">${def}</div><small>NPC</small></div></div>
      <div style="text-align:center" class="${atkWin?'win':'lose'}">${atkWin?`✅ สำเร็จ +${money(win)}`:'💥 พลาด — เสียลูกน้องที่ลงไป'}</div>
      <button class="btn" id="x">ปิด</button>`);
    logLine(`${title} ${atk} vs ${def} → ${atkWin?'สำเร็จ':'พลาด'}`);
    sel.clear(); $('x').onclick=()=>{closeOv();refresh();};
  };
}

    <div class="seg"><b>🎯 บุกยึดตึก</b>
      ${enemyBz.length?enemyBz.map(s=>{const c=BUILD[s],o=byId(room.board[s].owner);
        return `<button class="btn red sm" style="width:100%;margin:3px 0" data-raid="${s}">บุก ${c.name} (ของ ${esc(o?o.name:'')}) 🧱${room.board[s].dur}</button>`;}).join(''):'<div class="hint">ไม่มีตึกคู่แข่งให้บุก</div>'}</div>
    <div class="seg"><b>🔫 จ้างมือปืนเก็บผู้เล่น</b><div class="hint">ค่าจ้าง ${money(CFG.hitman_cost)} · มือปืน ATK ${CFG.hitman_atk} + ลูกน้องคุณ · เป้าตั้งรับได้</div>
      ${targets.map(t=>`<button class="btn sm" style="width:100%;margin:3px 0" data-hit="${t.id}" ${p.cash>=CFG.hitman_cost?'':'disabled'}>สั่งเก็บ ${esc(t.name)} ${p.cash>=CFG.hitman_cost?'':'(เงินไม่พอ)'}</button>`).join('')}</div>
    <button class="btn ghost" id="cx">ปิด</button>`);
  $('cx').onclick=closeOv;
  $('ovBody').querySelectorAll('[data-raid]').forEach(b=>b.onclick=()=>startRaid(+b.dataset.raid));
  $('ovBody').querySelectorAll('[data-hit]').forEach(b=>b.onclick=()=>startHitman(b.dataset.hit));
}

/* ===================== COMBAT (cross-device) ===================== */
function selList(){ const p=meP(); return [...sel].map(u=>{const x=(p.hand||[]).find(h=>h.uid===u);return x?{uid:u,c:x.c}:null;}).filter(Boolean); }
function sumSide(cards,role){ let base=0,enemy=0;
  cards.forEach(({c})=>{const d=CARDS[c];if(!d)return;
    if(d.t==='hench')base+=role==='atk'?(d.atk||0):(d.def||0);
    else{ base+=role==='atk'?(d.atk||0):(d.def||0); if(d.enemy)enemy+=d.enemy; }});
  return {base,enemy}; }
function handPickHtml(role){ const p=meP(); const h=p?p.hand||[]:[];
  return h.map(x=>{ const c=CARDS[x.c]; if(!c)return'';
    // attack-only (def 0 hench) cannot defend
    const cantDef=role==='def'&&c.t==='hench'&&c.def===0;
    return handCardHtml(x,cantDef);
  }).join(''); }
function bindPick(container,reRender){
  container.querySelectorAll('[data-uid]').forEach(el=>el.onclick=()=>{
    const u=el.dataset.uid; if(sel.has(u))sel.delete(u);
    else{ if(sel.size>=CFG.max_commit){ alert('สูงสุด '+CFG.max_commit+' ใบต่อศึก'); return;} sel.add(u); }
    reRender(); });
}

/* ---- RAID building ---- */
function startRaid(slot){ mode={type:'raid',slot}; sel.clear(); renderRaidPanel(); }
function renderRaidPanel(){
  const slot=mode.slot, c=BUILD[slot], b=room.board[slot], o=byId(b.owner);
  const cards=selList(); const {base}=sumSide(cards,'atk');
  ovShow(`<h2>🎯 บุก ${c.name}</h2>
    <div class="tot">ของ <b>${esc(o?o.name:'')}</b> · 🧱 คงทน ${b.dur} + ลูกน้องเฝ้า + เต๋า</div>
    <p class="hint">เลือกลูกน้องบุก (สูงสุด ${CFG.max_commit})</p>
    <div class="hand" id="rh">${handPickHtml('atk')}</div>
    <div class="tot">แต้มบุกจากการ์ด: <b>${base}</b> + เต๋า</div>
    <div class="row"><button class="btn red" id="go" ${cards.length?'':'disabled'}>🎲 ส่งบุก!</button>
      <button class="btn ghost" id="cx" style="flex:0 0 80px">ยกเลิก</button></div>
    <div class="hint">เจ้าของจะเด้งขึ้นมาตั้งรับสดๆ</div>`);
  bindPick($('rh'),renderRaidPanel);
  $('cx').onclick=()=>{mode=null;sel.clear();closeOv();};
  $('go').onclick=commitRaid;
}
async function commitRaid(){
  const slot=mode.slot, b=room.board[slot], cards=selList();
  const {base,enemy}=sumSide(cards,'atk'); const roll=d6();
  const battle={ seq:Date.now(), kind:'raid', phase:'await_def', slot,
    attacker:me.id, attackerName:me.name,
    defender:b.owner, defenderName:(byId(b.owner)||{}).name||'',
    dur:b.dur, atkCards:cards, atkBase:base, atkRoll:roll, atkEnemy:enemy };
  mode=null; sel.clear(); inBattleUI=true;
  await api.setRoom(room.id,{active_battle:battle});
  ovShow(`<div class="waitbox"><div class="big">${base}+🎲${roll}=${base+roll}</div>⏳ ส่งบุกแล้ว<br>รอ <b>${esc(battle.defenderName)}</b> ตั้งรับ…</div>`);
  logLine(`⚔️ คุณบุก ${BUILD[slot].name} — แต้ม ${base+roll}`);
}
/* ---- HITMAN ---- */
function startHitman(tid){ mode={type:'hitman',target:tid}; sel.clear(); renderHitmanPanel(); }
function renderHitmanPanel(){
  const t=byId(mode.target); const cards=selList(); const {base}=sumSide(cards,'atk');
  ovShow(`<h2>🔫 จ้างมือปืนเก็บ ${esc(t?t.name:'')}</h2>
    <div class="tot">มือปืนรับจ้าง ATK <b>${CFG.hitman_atk}</b> + ลูกน้องคุณ + เต๋า · ค่าจ้าง ${money(CFG.hitman_cost)}</div>
    <p class="hint">เลือกลูกน้องเสริม (สูงสุด ${CFG.max_commit})</p>
    <div class="hand" id="hh">${handPickHtml('atk')}</div>
    <div class="tot">แต้มรวมจากการ์ด+มือปืน: <b>${base+CFG.hitman_atk}</b> + เต๋า</div>
    <div class="row"><button class="btn red" id="go">🎯 สั่งเก็บ! (จ่าย ${money(CFG.hitman_cost)})</button>
      <button class="btn ghost" id="cx" style="flex:0 0 80px">ยกเลิก</button></div>`);
  bindPick($('hh'),renderHitmanPanel);
  $('cx').onclick=()=>{mode=null;sel.clear();closeOv();};
  $('go').onclick=commitHitman;
}
async function commitHitman(){
  const p=meP(); if(p.cash<CFG.hitman_cost){alert('เงินไม่พอ');return;}
  const cards=selList(); const {base,enemy}=sumSide(cards,'atk'); const roll=d6();
  await api.setPlayer(p.id,{cash:p.cash-CFG.hitman_cost});
  const battle={ seq:Date.now(), kind:'hitman', phase:'await_def',
    attacker:me.id, attackerName:me.name, defender:mode.target,
    defenderName:(byId(mode.target)||{}).name||'',
    atkCards:cards, atkBase:base+CFG.hitman_atk, atkRoll:roll, atkEnemy:enemy };
  mode=null; sel.clear(); inBattleUI=true;
  await api.setRoom(room.id,{active_battle:battle});
  ovShow(`<div class="waitbox"><div class="big">${battle.atkBase}+🎲${roll}</div>⏳ มือปืนออกล่า<br>รอ <b>${esc(battle.defenderName)}</b> ตั้งรับ…</div>`);
  logLine(`🔫 คุณสั่งเก็บ ${esc(battle.defenderName)}`);
}

/* ===================== BATTLE STATE MACHINE ===================== */
function handleBattle(b){
  if(!b||!b.phase||b.phase==='done'){ if(inBattleUI){ inBattleUI=false; mode=null; if(bailTimer)clearInterval(bailTimer); closeOv(); } return; }
  const mine=meP(); const iAmDef=mine&&b.defender===mine.id, iAmAtk=mine&&b.attacker===mine.id;
  if(b.phase==='await_def'){
    if(iAmDef && mode!=='defending'){ mode='defending'; sel.clear(); renderDefend(b); }
    return;
  }
  if(b.phase==='resolved'){
    const finalAtk=b.atkBase+b.atkRoll-(b.defEnemy||0);
    let finalDef;
    if(b.folded) finalDef=-999;
    else{ const durAdd=(b.kind==='raid')?(b.dur||0):0; finalDef=b.defBase+b.defRoll+durAdd-(b.atkEnemy||0); }
    const atkWin=finalAtk>=finalDef;         // tie → attacker wins (v1 simplification of reroll)
    if(appliedSeq!==b.seq){ appliedSeq=b.seq; applyResult(b,atkWin,finalAtk,finalDef,iAmAtk,iAmDef); }
    showResult(b,atkWin,finalAtk,finalDef,iAmAtk,iAmDef);
    return;
  }
  if(b.phase==='downed'){ // hitman success → bail window
    if(iAmDef && mode!=='bailing'){ mode='bailing'; renderBail(b); }
    else if(iAmAtk){ showHitWait(b); }
    return;
  }
  if(b.phase==='revived'){
    if(appliedSeq!=='rev'+b.seq){ appliedSeq='rev'+b.seq; applyRevive(b,iAmAtk,iAmDef); }
    showReviveResult(b,iAmAtk,iAmDef);
    return;
  }
}
function renderDefend(b){
  inBattleUI=true; const atkShown=b.atkBase+b.atkRoll; const cards=selList(); const {base}=sumSide(cards,'def');
  const durAdd=(b.kind==='raid')?(b.dur||0):0;
  const title=b.kind==='hitman'?`🚨 มือปืนมาเก็บคุณ! (${esc(b.attackerName)} จ้าง)`:`🚨 ${esc(b.attackerName)} บุก ${BUILD[b.slot].name}!`;
  ovShow(`<h2>${title}</h2>
    <div class="tot">แต้มบุกที่ต้องเจอ: <b style="color:var(--defc)">${atkShown}</b></div>
    ${durAdd?`<div class="tot" style="font-size:12px">🧱 คงทนตึกช่วยรับ +${durAdd}</div>`:''}
    <p class="hint">เลือกลูกน้องรับ (ตัว 🛡0 กันไม่ได้ · สูงสุด ${CFG.max_commit})</p>
    <div class="hand" id="dh">${handPickHtml('def')}</div>
    <div class="tot">แต้มรับจากการ์ด: <b>${base}</b>${durAdd?`+🧱${durAdd}`:''} + เต๋า</div>
    <div class="row"><button class="btn ok" id="go" ${cards.length?'':'disabled'}>🛡️ ทอยรับ!</button>
      <button class="btn ghost" id="fold">🏳️ ยอมแพ้</button></div>`);
  bindPick($('dh'),()=>renderDefend(b));
  $('go').onclick=()=>commitDefense(false); $('fold').onclick=()=>commitDefense(true);
}
async function commitDefense(folded){
  const b=room.active_battle; if(!b)return; let upd;
  if(folded) upd={...b,phase:'resolved',folded:true,defCards:[],defBase:0,defRoll:0,defEnemy:0};
  else{ const cards=selList(); const {base,enemy}=sumSide(cards,'def'); const roll=d6();
    upd={...b,phase:'resolved',folded:false,defCards:cards,defBase:base,defRoll:roll,defEnemy:enemy}; }
  mode=null; sel.clear();
  await api.setRoom(room.id,{active_battle:upd});
}
// winner keeps committed henchmen worth <= margin (lowest stat dies first); loser loses all; buffs consumed
function survivors(committed,role,margin){
  const hench=committed.filter(x=>CARDS[x.c]&&CARDS[x.c].t==='hench');
  const sorted=[...hench].sort((a,b)=>{const A=CARDS[a.c],B=CARDS[b.c];const sa=role==='atk'?A.atk:A.def, sb=role==='atk'?B.atk:B.def;return sb-sa;});
  const keep=[]; let acc=0;
  for(const x of sorted){ const st=role==='atk'?CARDS[x.c].atk:CARDS[x.c].def; if(acc+st<=margin){acc+=st;keep.push(x.uid);} }
  return new Set(keep); // uids that SURVIVE
}
async function applyResult(b,atkWin,fa,fd,iAmAtk,iAmDef){
  const p=meP(); if(!p)return; let hand=[...(p.hand||[])];
  const myCommitted=iAmAtk?(b.atkCards||[]):iAmDef?(b.defCards||[]):[];
  const iWon=(iAmAtk&&atkWin)||(iAmDef&&!atkWin);
  const role=iAmAtk?'atk':'def';
  const kill=new Set();
  if(iWon){ const margin=Math.max(0,fa-fd===0?0:(iAmAtk?fa-fd:fd-fa)); const surv=survivors(myCommitted,role,margin);
    myCommitted.forEach(({uid,c})=>{ const d=CARDS[c]; if(!d)return;
      if(d.t==='buff')kill.add(uid); else if(!surv.has(uid))kill.add(uid); }); }
  else { myCommitted.forEach(({uid})=>kill.add(uid)); }  // loser loses all committed
  if(kill.size){ hand=hand.filter(x=>!kill.has(x.uid)); await api.setPlayer(p.id,{hand}); }
  // attacker drives next phase
  if(iAmAtk){
    if(b.kind==='raid'){
      if(atkWin){ const bd={...room.board}; const cur=bd[b.slot]; let dur=(cur.dur||b.dur)-1;
        if(dur<=0){ bd[b.slot]={owner:b.attacker,dur:CFG.dur_start}; logLine(`🏴 ยึด ${BUILD[b.slot].name} สำเร็จ!`); }
        else{ bd[b.slot]={owner:cur.owner,dur}; logLine(`🎯 บุก ${BUILD[b.slot].name} สำเร็จ · คงทนเหลือ ${dur}`); }
        await api.setRoom(room.id,{board:bd}); }
      setTimeout(()=>api.setRoom(room.id,{active_battle:{...b,phase:'done'}}),3800);
    } else if(b.kind==='hitman'){
      if(atkWin){ setTimeout(()=>api.setRoom(room.id,{active_battle:{...b,phase:'downed',bailUntil:Date.now()+CFG.bail_secs*1000}}),2600); }
      else { setTimeout(()=>api.setRoom(room.id,{active_battle:{...b,phase:'done'}}),3800); }
    }
  }
}
function showResult(b,atkWin,fa,fd,iAmAtk,iAmDef){
  if(b.phase!=='resolved')return; inBattleUI=true;
  if(b.kind==='hitman'&&atkWin&&iAmAtk){ /* will move to downed; show brief */ }
  const iWon=(iAmAtk&&atkWin)||(iAmDef&&!atkWin); const neutral=!iAmAtk&&!iAmDef;
  const titleWin=b.kind==='hitman'?'🎯 มือปืนจัดการสำเร็จ!':'⚔️ ฝ่ายบุกชนะ!';
  const titleLose=b.kind==='hitman'?'🛡️ รอดจากมือปืน!':'🛡️ ป้องกันสำเร็จ!';
  $('ov').classList.add('on');
  $('ovBody').innerHTML=`<h2>${atkWin?titleWin:titleLose}</h2>
    <div class="vs"><div class="side a"><div class="n">${fa}</div><small>${esc(b.attackerName)}</small></div><div class="x">⚔️</div>
      <div class="side d"><div class="n">${b.folded?'พับ':fd}</div><small>${esc(b.defenderName)}</small></div></div>
    <div style="text-align:center;margin:8px 0" class="${iWon?'win':(neutral?'':'lose')}">
      ${neutral?'':(iWon?'✅ คุณชนะ!':'💥 คุณแพ้ — เสียลูกน้องที่ลงสนาม')}</div>
    ${(b.kind==='hitman'&&atkWin)?'<div class="hint">เป้าหมายร่อแร่… มีช่วงประกันตัว</div>':''}
    ${iAmAtk?'<button class="btn" id="cl">ปิด</button>':'<div class="hint">รอผู้บุกปิด…</div>'}`;
  if(iAmAtk&&$('cl')) $('cl').onclick=()=>{ closeOv(); if(b.kind==='raid'||!atkWin) refresh(); };
}
/* ---- hitman downed → bail ---- */
function showHitWait(b){ inBattleUI=true; $('ov').classList.add('on');
  $('ovBody').innerHTML=`<div class="waitbox"><div class="big">🩸</div>${esc(b.defenderName)} ร่อแร่<br>รอดูว่าจะประกันตัวได้มั้ย…</div>`; }
function renderBail(b){
  inBattleUI=true; if(bailTimer)clearInterval(bailTimer);
  const p=meP(); const canBail=p.cash>=CFG.bail_cost;
  $('ov').classList.add('on');
  const draw=()=>{ const left=Math.max(0,Math.ceil((b.bailUntil-Date.now())/1000));
    $('ovBody').innerHTML=`<h2>🩸 คุณถูกมือปืนเก็บ!</h2>
      <div class="count">⏳ ${left}s</div>
      <p class="hint">จ่ายค่าประกันตัว ${money(CFG.bail_cost)} เพื่อฟื้นทันที · ไม่งั้นต้องเสี่ยงชุบชีวิต</p>
      <button class="btn ok" id="bail" ${canBail?'':'disabled'}>${canBail?`ประกันตัว (${money(CFG.bail_cost)})`:'เงินไม่พอประกัน'}</button>`;
    const bb=$('bail'); if(bb)bb.onclick=doBail;
    if(Date.now()>=b.bailUntil){ clearInterval(bailTimer); mode=null; toRevive(b); }
  };
  draw(); bailTimer=setInterval(draw,300);
}
async function doBail(){ const b=room.active_battle; if(!b)return; if(bailTimer)clearInterval(bailTimer);
  const p=meP(); if(p.cash<CFG.bail_cost)return;
  await api.setPlayer(p.id,{cash:p.cash-CFG.bail_cost});
  await api.setRoom(room.id,{active_battle:{...b,phase:'done',bailed:true}});
  logLine(`💵 ${esc(p.name)} ประกันตัวรอด (จ่าย ${money(CFG.bail_cost)})`); mode=null; closeOv(); refresh();
}
async function toRevive(b){ // defender's client rolls revive
  if(room.active_battle&&room.active_battle.phase!=='downed')return;
  const roll=d6(); const survive=roll>=4;
  await api.setRoom(room.id,{active_battle:{...b,phase:'revived',revRoll:roll,survive}});
}
async function applyRevive(b,iAmAtk,iAmDef){
  const def=byId(b.defender), atk=byId(b.attacker);
  if(b.survive){
    if(iAmDef){ await api.setPlayer(def.id,{cash:Math.floor((def.cash||0)/2),stars:Math.max(0,def.stars-2)});
      logLine(`🙏 ${esc(def.name)} ฟื้นแบบหมดตัว (เสียเงินครึ่ง)`); }
  } else {
    // becomes killer's henchman → eliminated; killer +1 random henchman card
    if(iAmDef){ await api.setPlayer(def.id,{status:'jailed'}); } // use jailed state = out of play
    if(iAmAtk){ const nh=[...(atk.hand||[])]; if(nh.length<CFG.hand_max)nh.push(dealHand(1)[0]);
      await api.setPlayer(atk.id,{hand:nh}); logLine(`⛓️ ${esc(def.name)} กลายเป็นลูกน้องของ ${esc(atk.name)}!`); }
  }
  if(iAmAtk) setTimeout(()=>{ api.setRoom(room.id,{active_battle:{...b,phase:'done'}}); checkWin(); },3600);
}
function showReviveResult(b,iAmAtk,iAmDef){
  inBattleUI=true; $('ov').classList.add('on');
  $('ovBody').innerHTML=`<h2>${b.survive?'🙏 ชุบชีวิตสำเร็จ!':'⛓️ ร่วงเป็นลูกน้อง!'}</h2>
    <div class="big">🎲 ${b.revRoll}</div>
    <div style="text-align:center" class="${b.survive?'win':'lose'}">
      ${b.survive?`${esc(b.defenderName)} ฟื้นแบบหมดตัว (เสียเงินครึ่ง, ★−2)`:`${esc(b.defenderName)} กลายเป็นลูกน้องของ ${esc(b.attackerName)} — ออกจากเกม`}</div>
    ${iAmAtk?'<button class="btn" id="cl">ปิด</button>':'<div class="hint">รอผู้จ้างปิด…</div>'}`;
  if(iAmAtk&&$('cl'))$('cl').onclick=()=>{closeOv();refresh();};
}

/* ===================== WIN ===================== */
async function checkWin(){
  const [ps,r]=await Promise.all([api.players(room.id),api.getRoom(room.id)]);
  const alive=ps.filter(p=>p.status!=='jailed');
  if(alive.length<=1 && r && r.state==='playing'){
    await api.setRoom(room.id,{state:'ended',winner:alive[0]?alive[0].id:null,active_battle:null});
  }
}
function showWinner(){ const w=room.winner?byId(room.winner):null;
  $('ov').classList.add('on');
  $('ovBody').innerHTML=`<h2>🏆 จบเกม</h2><div class="big">${w?esc(w.name):'—'}</div>
    <div style="text-align:center" class="win">เป็นผู้รอดคนสุดท้าย — รวยที่สุด!</div>
    <button class="btn" id="again">เล่นใหม่</button>`;
  $('again').onclick=()=>location.reload();
}

/* ===================== INIT ===================== */
$('verBadge').textContent=VERSION; $('subLine').textContent='การ์ดแบทเทิลเทิร์นเบส · '+VERSION;
if(DEMO)$('demoRibbon').style.display='block';
</script>
